# ulf-light - the light twin of ulf. Same monochrome orange band (hue 22-108),
# same pinned accent; the neutral ramp is mirrored so the blacks become whites.
#
# The chromatic slots are NOT the dark theme's colours: on a near-white ground
# every slot has to be dark to stay legible, which pushes the whole palette
# into rust and terracotta. Positions come from palette-search-light.py, which
# maximises the worst of all 91 non-twin pairs under normal, protanopic and
# deuteranopic vision. Worst pair dE = 0.0423.
mode = "light"

accent = "#ff5a36"
selection = "#cfc1ba"
muted = "#8c857f"

background = "#faf6f3"
dark_background = "#f1ece8"
darker_background = "#e3dcd8"
lighter_background = "#e6ded8"

foreground = "#221c18"
dark_foreground = "#9d9792"
light_foreground = "#4d4642"
bright_foreground = "#0f0a07"

red = "#720000"
orange = "#8c3e0a"
yellow = "#8b6000"
green = "#7e2913"
cyan = "#564241"
blue = "#3c342b"
magenta = "#ad4e44"
brown = "#684f35"

bright_red = "#c1624e"
bright_yellow = "#af7c00"
bright_green = "#cf794b"
bright_cyan = "#6b5d58"
bright_blue = "#827271"
bright_magenta = "#c3746f"
